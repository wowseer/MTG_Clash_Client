[workspace]
members = [".", "crates/clash-protocol", "crates/clash-forge-client"]
resolver = "3"

[package]
name = "mtg_clash"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7", "register-docs"] }
clash-protocol = { path = "crates/clash-protocol" }
clash-forge-client = { path = "crates/clash-forge-client" }
serde_json = "1"
